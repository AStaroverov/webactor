<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>webactor</title>
        <link rel="stylesheet" href="panel.css" />
    </head>
    <body>
        <header class="toolbar">
            <button id="record" class="toggle" title="Pause / resume recording">
                <span class="dot"></span><span id="record-label">Recording</span>
            </button>
            <button id="clear" title="Clear captured graph and history">Clear</button>
            <button id="fit" title="Reset layout and zoom">Reset view</button>
            <span class="separator"></span>
            <label class="field">
                <input id="search" type="search" placeholder="filter actors…" />
            </label>
            <label class="field">
                <select id="thread"><option value="">all threads</option></select>
            </label>
            <label class="check"><input id="animate" type="checkbox" checked /> flow</label>
            <label class="check"><input id="payload" type="checkbox" checked /> payloads</label>
            <label class="check"><input id="ports" type="checkbox" /> ports</label>
            <span class="grow"></span>
            <span id="status" class="status">waiting for webactor…</span>
        </header>

        <main>
            <section class="graph">
                <canvas id="canvas"></canvas>
                <div class="legend">
                    <span><i style="background: #5aa9ff"></i>actor</span>
                    <span><i style="background: #a78bfa"></i>retranslator</span>
                    <span><i style="background: #f59e0b"></i>supervisor</span>
                    <span><i style="background: #34d399"></i>thread port</span>
                    <span><i style="background: #64748b"></i>port</span>
                </div>
                <div id="counts" class="counts"></div>
            </section>

            <div id="splitter" class="splitter"></div>

            <aside class="details">
                <div id="node-header" class="node-header empty">select an actor in the graph</div>
                <div class="tabs">
                    <button data-direction="all" class="active">all</button>
                    <button data-direction="in">incoming</button>
                    <button data-direction="out">outgoing</button>
                    <span class="grow"></span>
                    <span id="message-count" class="muted"></span>
                </div>
                <div id="messages" class="messages"></div>
                <div class="payload-header">payload</div>
                <div id="payload-view" class="payload-view"></div>
            </aside>
        </main>

        <script src="panel.js"></script>
    </body>
</html>
