<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webactor live user</title>
    <style>
        body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #131313; color: #ddd; margin: 2rem; }
        h1 { font-size: 1.2rem; margin-bottom: 0.25rem; }
        h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin: 1.5rem 0 0.5rem; }
        a { color: #7cacf8; }
        button { font: inherit; margin: 0 0.5rem 0.5rem 0; padding: 0.4rem 0.8rem; cursor: pointer; background: #222; color: #ddd; border: 1px solid #444; border-radius: 4px; }
        button:hover:not(:disabled) { background: #333; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        button.primary { border-color: #2f6f4f; background: #16301f; }
        button.primary.running { border-color: #7f3030; background: #35181a; }
        button.busy { border-color: #6f5f2f; background: #302a16; }
        #stats { border: 1px solid #333; border-radius: 4px; padding: 0.6rem 0.8rem; line-height: 1.6; }
        #stats .activity { color: #8a8; }
        #stats .off { color: #777; }
        pre { white-space: pre-wrap; border-top: 1px solid #333; padding-top: 1rem; max-height: 40vh; overflow: auto; }
    </style>
</head>
<body>
    <h1>webactor live user</h1>
    <p><a href="/">← load test scenarios</a> · one gesture per button, at the pace a person works</p>

    <h2>session</h2>
    <div id="session"></div>

    <h2>actions</h2>
    <div id="actions"></div>

    <h2>state</h2>
    <div id="stats"></div>

    <pre id="log"></pre>
    <script type="module" src="/src/live.ts"></script>
</body>
</html>
