name: Setup
description: Install pnpm, Node.js and workspace dependencies

runs:
    using: composite
    steps:
        - uses: pnpm/action-setup@v6

        - uses: actions/setup-node@v7
          with:
              node-version-file: .node-version
              cache: pnpm

        - run: pnpm install --frozen-lockfile
          shell: bash
